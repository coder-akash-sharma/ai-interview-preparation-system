services:
  - type: web
    name: ai-interview-backend
    runtime: node
    plan: free
    rootDir: ai-interview-backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: AI_SERVICE_URL
        value: http://ai-interview-ai-service:10000

  - type: web
    name: ai-interview-ai-service
    runtime: python
    plan: free
    rootDir: ai-interview-backend/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
